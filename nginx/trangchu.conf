# vanlang-home — Cấu hình Nginx cho trangchu.vanlang.biz
# Trang chủ (static HTML/CSS/JS) và WebApp game là hai server_name khác nhau
# trên cùng máy — không can thiệp GameSrc / không restart service game thừa.

server {
    listen 80;
    listen [::]:80;

    server_name trangchu.vanlang.biz;

    root /opt/vanlang-home;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Certbot sẽ tự bổ sung block HTTPS khi cấp cert cho trangchu.vanlang.biz.
